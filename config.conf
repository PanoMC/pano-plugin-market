# Plugin config version used for migrations (DO NOT manually change).
version = 2

# ============================================================
# Store
# ============================================================
storeName = "Market"
storeDescription = ""
storeBackgroundImage = "store-background-ac19bab1-3f69-48f1-94fc-ac51b293eb96.jpg"

# false: the storefront endpoints answer STORE_DISABLED; the panel is unaffected.
storeEnabled = true

# Time zone of the store day (e.g. Europe/Istanbul). Empty = the server's default zone.
storeTimeZone = ""

# One of: SINGLE, DISPLAY, MULTI
currencyMode = "SINGLE"

# ISO 4217 codes offered besides the store currency in DISPLAY / MULTI mode.
additionalCurrencies = []

# Products without a price in the buyer's currency. One of: CONVERT, HIDE
multiCurrencyFallback = "CONVERT"

# Store currency. ISO 4217 code supported by the store engine (e.g. TRY, USD, EUR, GBP, JPY).
currency = "TRY"

# Currency the stats/reports are displayed in. ISO 4217 code supported by the store engine (e.g. TRY, USD, EUR, GBP, JPY).
statsCurrency = "TRY"

# How the sales -> stats exchange rate is maintained. One of: AUTO, MANUAL
exchangeRateMode = "AUTO"

# Current view rate: stats-currency units per 1 sales-currency unit.
exchangeRate = 1.0

# Epoch millis the exchange rate was last updated.
exchangeRateUpdatedAt = 1794679369939

# Hours between automatic exchange-rate refreshes (AUTO mode).
exchangeRateAutoIntervalHours = 6
vatPercent = 20.0

# Whether displayed prices already include VAT.
showVatInPrice = true
testMode = false
allowGuestCheckout = true
minimumOrderAmount = 0.0
removeCents = false
showBestsellers = true
showFeaturedProducts = true
showComparisons = true
sendEmailAfterPurchase = true

# Mail kinds switched off individually.
mailDisabledKinds = []
mailAttachInvoice = true
mailReplyTo = ""
mailOrderDeliveredDelayMinutes = 10
allowGiftPurchase = true

# One of: OFF, OPTIONAL, REQUIRED
billingInfoMode = "OFF"
legalTextRequired = true

# Lifetime of a PENDING order in minutes.
orderExpiryMinutes = 60
bankTransferExpiryHours = 72
autoRefundDuplicatePayments = true

# Whether automatic discounts and coupon codes can apply to the same order.
combineDiscountsAndCoupons = true

# ============================================================
# Invoices
# ============================================================
invoiceEnabled = true

# 1-8 characters A-Z, 0-9; not TEST; different from the credit note series.
invoiceSeries = "INV"
invoiceSellerName = ""
invoiceSellerAddress = ""
invoiceSellerTaxOffice = ""
invoiceSellerTaxNumber = ""
invoiceFooter = ""
invoiceCreditNoteSeries = "CN"
invoiceCreditOrders = false

# Fixed invoice locale. Empty = the order's locale.
invoiceLocale = "tr"
invoiceShowLogo = true

# ============================================================
# Credits
# ============================================================
creditsEnabled = true

# Display name of the credit currency. Leave empty to use the site language's localized default ("Credits").
creditName = ""
cashbackPercent = 0.0
onlyAcceptCredits = false

# Base-currency value of one credit (>= 0.01).
creditValue = 1.0
allowMixedCreditPayment = false
creditTopUpEnabled = false
creditTopUpFreeAmount = false
creditTopUpMin = 1.0
creditTopUpMax = 10000.0
revokeOnRefund = true
revokeOnChargeback = true

# ============================================================
# Delivery and subscriptions
# ============================================================
deliveryMaxAttempts = 5

# Give up waiting for an offline player after N days (0 = never).
deliveryOnlineWaitDays = 0
deliveryAckTimeoutSeconds = 30
subscriptionGraceDays = 3
subscriptionReminderDays = 3
subscriptionManualFallback = true

# ============================================================
# Abuse and chargebacks
# ============================================================
autoBlockOnChargeback = true
revokeCreditOrdersOnTopUpChargeback = true

# Days a creator earning stays PENDING after payment.
creatorEarningHoldDays = 14

# JSON action array run on a chargeback.
chargebackActions = "[]"

# 0 disables the limit.
checkoutRateLimitPerMinute = 6
quoteRateLimitPerMinute = 60
couponLockThreshold = 5
couponLockMinutes = 15

# ============================================================
# Storefront
# ============================================================
storePageSize = 24
moduleRecentBuyers = true
moduleRecentBuyersCount = 10
moduleRecentBuyersShowAmount = false
moduleTopSupporters = true

# One of: MONTH, ALL_TIME
moduleTopSupportersPeriod = "MONTH"
moduleTopSupportersCount = 5
moduleGoal = true
moduleSaleBadges = true
moduleSaleCountdown = true
moduleStats = false

# Host sidebars the market widgets render in: home, profile.
moduleSidebars = [
    "home"
]

# ============================================================
# In-game
# ============================================================
mcStoreCommand = true
mcCreditsCommand = true
mcJoinNotifications = true
mcStoreMenu = true
mcAdminCommands = true
mcPlaceholders = true
mcLuckPerms = true
mcBroadcast = false

# Placeholders: {player} {product} {quantity} {store}; color codes with &.
mcBroadcastTemplate = "&a{player} &7bought &e{product}&7 from the &b{store}&7!"

# In-game admin sub-commands switched off: give-credits, take-credits, set-credits, grant-product, purchases.
mcDisabledAdminCommands = []

# One of: OFF, PROVIDER, CONVERT
mcVaultMode = "OFF"

# Server-economy units per credit.
mcVaultRate = 1.0

# One of: BOTH, TO_SERVER, TO_CREDITS
mcVaultDirection = "BOTH"
