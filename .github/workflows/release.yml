# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Pano Plugin Build

on:
  push:
    branches: ['dev', 'main']

permissions:
  contents: read

jobs:
  get-next-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Dry run to get next release version
        id: get-next-version
        run: |
          npm install -D git+https://github.com/PanoMC/semantic-release-pano.git
          export NEXT_TAG_VERSION=$(npx semantic-release --dry-run | grep 'next release version is ' | awk -F"next release version is " '{print $2}')
          echo "new_tag_version=${NEXT_TAG_VERSION}" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
          PANO_TOKEN: ${{ secrets.PANO_TOKEN }}
          PANO_PROD_TOKEN: ${{ secrets.PANO_PROD_TOKEN }}

      - name: Echo new_tag_version
        run: |
          echo "Extracted Tag Version: ${{ steps.get-next-version.outputs.new_tag_version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
    outputs:
      new_tag_version: ${{ steps.get-next-version.outputs.new_tag_version }}

  build-and-release:
    runs-on: ubuntu-latest
    needs: get-next-version
    if: ${{needs.get-next-version.outputs.new_tag_version != ''}}
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: market-it-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Install
        run: bun install

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: UI checks
        run: bun run check:ui

      # T2 database tier (17 section 3.4): a red dbTest blocks the release. The E2E tier (needs a full Pano instance) is not run here.
      - name: Database tests
        env:
          PANO_IT_MARIADB: 127.0.0.1:3306
          PANO_IT_MARIADB_PASSWORD: market-it-root
        run: ./gradlew dbTest -Pnoui -Pfabric -Pversion=${{ needs.get-next-version.outputs.new_tag_version }}

      # check = unit tests, Minecraft-side tests (mcTest), jar rules; -Pfabric also builds build/mc/*-fabric-<v>.jar
      - name: Build
        run: |
          ./gradlew build -Pfabric \
            -Pversion=${{ needs.get-next-version.outputs.new_tag_version }}

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
          PANO_TOKEN: ${{ secrets.PANO_TOKEN }}
          PANO_PROD_TOKEN: ${{ secrets.PANO_PROD_TOKEN }}
        run: |
          npm install -D git+https://github.com/PanoMC/semantic-release-pano.git
          npx semantic-release
