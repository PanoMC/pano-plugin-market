pluginId=pano-plugin-market
pluginName=Market
pluginDescription=Flexible plugin that lets you easily list, manage, and sell products on your website.
pluginPanoVersion=local-build
pluginClass=com.panomc.plugins.market.MarketPlugin
pluginDeveloper=Pano
pluginLicense=MIT
pluginSourceUrl=https://github.com/PanoMC/pano-plugin-market
pluginDependencies=
pluginRequires=

pf4jVersion=3.13.0
vertxVersion=5.0.1
gsonVersion=2.13.2
handlebarsVersion=4.4.0
springContextVersion=5.3.39
organization=panomc
panoVersion=1.0.0-alpha.541

# Minecraft-side component (19 section 2.1): the same API versions pano-mc-plugin compiles against.
# panoMcVersion = the pano-mc-plugin release whose Core jar the mc source sets compile against (Ivy pattern on the GitHub
# release asset pano-core-<version>.jar, 15 section 2.1 X-1). Releases up to alpha.66 do not carry the asset yet: until the
# first release built after commit 1e66bd3 exists, builds pass -PpanoCoreJar=<local Core jar> (or rely on the umbrella
# fallback in build.gradle.kts) and this pin is bumped to that release.
panoMcVersion=1.0.0-alpha.67
spigotApiVersion=1.8.8-R0.1-SNAPSHOT
bungeecordApiVersion=1.21-R0.4
velocityApiVersion=3.4.0-SNAPSHOT
luckPermsApiVersion=5.5
vaultApiVersion=1.7
placeholderApiVersion=2.11.6

# standalone builds (CI): the Kotlin daemon default heap is too small for this module
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g
